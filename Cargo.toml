[package]
name = "es6"
version = "0.1.0"
edition = "2024"

[features]
default = ["cli", "modules"]
modules = ["console", "fs", "os", "path", "timers"]
# Optional CLDR/ICU4X-backed Intl support. Kept out of the default build
# because the locale data and time zone database add significant binary size.
intl = ["dep:icu_datetime", "dep:icu_locale", "dep:writeable", "dep:jiff"]
# Experimental foundation for the staged register/8-byte-value core.
oxide_core = []
cli = ["dep:clap", "dep:miette"]
console = []
fs = []
os = ["dep:sysinfo"]
path = []
timers = []

[dependencies]
thiserror = "2"
icu_datetime = { version = "2.3", optional = true, features = ["compiled_data"] }
icu_locale = { version = "2.3", optional = true }
writeable = { version = "0.6", optional = true }
jiff = { version = "0.2", optional = true }
hashbrown = "0.17"
compact_str = "0.10"
indexmap = "2"
unicode-ident = "1"
ryu = "1"
regress = "0.12"
rustc-hash = "2"
serde_json = { version = "1", features = ["preserve_order"] }
smallvec = "1"
sysinfo = { version = "0.39", optional = true, default-features = false, features = [
  "system",
] }
clap = { version = "4", features = ["derive"], optional = true }
miette = { version = "7", features = ["fancy"], optional = true }
git-version = "0.3.9"
const-str = "1.1.0"

[[bin]]
name = "es6"
path = "src/main.rs"
required-features = ["cli"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
