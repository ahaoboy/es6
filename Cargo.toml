[package]
name = "es6"
version = "0.1.0"
edition = "2024"

[features]
default = ["cli", "modules"]
modules = ["console", "fs", "os", "path", "timers"]
cli = ["dep:clap", "dep:miette"]
console = []
fs = []
os = ["dep:sysinfo"]
path = []
timers = []

[dependencies]
indexmap = "2"
unicode-ident = "1"
ryu = "1"
regress = "0.12"
rustc-hash = "2"
serde_json = { version = "1", features = ["preserve_order"] }
smallvec = "1"
time = { version = "0.3", features = ["local-offset", "parsing", "formatting"] }
sysinfo = { version = "0.39", optional = true, default-features = false, features = [
  "system",
] }
clap = { version = "4", features = ["derive"], optional = true }
miette = { version = "7", features = ["fancy"], optional = true }

[[bin]]
name = "es6"
path = "src/main.rs"
required-features = ["cli"]
